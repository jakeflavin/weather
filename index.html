    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
      <!--
      Resolves the theme before the first paint. Every app switches tokens on
      <html data-theme>, but React only sets it on mount — so without this the page
      paints the light palette first, which is a white flash on a dark screen.
    -->
    <script>
      try {
        var stored = localStorage.getItem('wx:theme');
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme =
          stored === 'light' || stored === 'dark' ? stored : dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
